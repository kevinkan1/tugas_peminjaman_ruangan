{% extends "base.html" %}
{% block title %}Gedung{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Gedung</h1>
  <button class="btn primary" id="btnBaru">+ Tambah gedung</button>
</div>
<section class="card"><div id="tbl" class="table-wrap"></div></section>

<dialog id="dlg">
  <form id="form" class="form">
    <h2 id="judul">Tambah gedung</h2>
    <label>Kode <input name="kode" maxlength="10" required></label>
    <label>Nama <input name="nama" maxlength="100" required></label>
    <div class="form-actions">
      <button type="button" class="btn" data-close>Batal</button>
      <button class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let rows = [], editId = null;
const form = $("#form");

async function load() {
  rows = await api("/gedung");
  renderTable($("#tbl"), [
    { h: "Kode", f: (r) => `<strong>${esc(r.kode)}</strong>` },
    { h: "Nama", f: (r) => esc(r.nama) },
    { h: "", f: (r) => `<div class="actions">
        <button class="btn sm" data-act="edit" data-id="${r.id}">Ubah</button>
        <button class="btn sm danger" data-act="hapus" data-id="${r.id}">Hapus</button></div>` },
  ], rows);
}

function buka(r) {
  editId = r ? r.id : null;
  $("#judul").textContent = r ? "Ubah gedung" : "Tambah gedung";
  form.kode.value = r ? r.kode : "";
  form.nama.value = r ? r.nama : "";
  openDlg("dlg");
}

$("#btnBaru").onclick = () => buka(null);

$("#tbl").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const r = rows.find((x) => x.id === +b.dataset.id);
  if (b.dataset.act === "edit") buka(r);
  else if (confirm(`Hapus gedung "${r.nama}"?`)) guard(async () => {
    await api(`/gedung/${r.id}`, { method: "DELETE" });
    toast("Gedung dihapus"); await load();
  });
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  guard(async () => {
    const body = { kode: form.kode.value.trim(), nama: form.nama.value.trim() };
    await api(editId ? `/gedung/${editId}` : "/gedung", { method: editId ? "PUT" : "POST", body });
    $("#dlg").close(); toast("Gedung disimpan"); await load();
  });
});

guard(load);
</script>
{% endblock %}
