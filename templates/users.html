{% extends "base.html" %}
{% block title %}Pengguna{% endblock %}

{% block content %}
<div class="page-head">
  <h1>Pengguna</h1>
  <button class="btn primary" id="btnBaru">+ Tambah pengguna</button>
</div>
<section class="card"><div id="tbl" class="table-wrap"></div></section>

<dialog id="dlg">
  <form id="form" class="form">
    <h2 id="judul">Tambah pengguna</h2>
    <label>Nama <input name="nama" maxlength="100" required></label>
    <label>Email <input type="email" name="email" maxlength="100" required></label>
    <label>Password
      <input type="password" name="password" minlength="6" maxlength="72" autocomplete="new-password">
      <span class="hint" id="pwHint"></span>
    </label>
    <div class="row2">
      <label>Role
        <select name="role"><option value="peminjam">peminjam</option><option value="admin">admin</option></select>
      </label>
      <label>No. HP <input name="no_hp" maxlength="20"></label>
    </div>
    <div class="form-actions">
      <button type="button" class="btn" data-close>Batal</button>
      <button class="btn primary">Simpan</button>
    </div>
  </form>
</dialog>
{% endblock %}

{% block scripts %}
<script>
let rows = [], editId = null;
const form = $("#form");

async function load() {
  rows = await api("/users");
  renderTable($("#tbl"), [
    { h: "Nama", f: (r) => `<strong>${esc(r.nama)}</strong>` },
    { h: "Email", f: (r) => esc(r.email) },
    { h: "Role", f: (r) => badge(r.role) },
    { h: "No. HP", f: (r) => esc(r.no_hp || "-") },
    { h: "Terdaftar", f: (r) => fmtDT(r.created_at) },
    { h: "", f: (r) => `<div class="actions">
        <button class="btn sm" data-act="edit" data-id="${r.id}">Ubah</button>
        <button class="btn sm danger" data-act="hapus" data-id="${r.id}">Hapus</button></div>` },
  ], rows);
}

function buka(r) {
  editId = r ? r.id : null;
  $("#judul").textContent = r ? "Ubah pengguna" : "Tambah pengguna";
  form.nama.value = r ? r.nama : "";
  form.email.value = r ? r.email : "";
  form.password.value = "";
  form.password.required = !r;
  $("#pwHint").textContent = r ? "Kosongkan jika tidak ingin mengganti password" : "Minimal 6 karakter";
  form.role.value = r ? r.role : "peminjam";
  form.no_hp.value = r ? (r.no_hp || "") : "";
  openDlg("dlg");
}

$("#btnBaru").onclick = () => buka(null);

$("#tbl").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-act]");
  if (!b) return;
  const r = rows.find((x) => x.id === +b.dataset.id);
  if (b.dataset.act === "edit") buka(r);
  else if (confirm(`Hapus pengguna "${r.nama}"?`)) guard(async () => {
    await api(`/users/${r.id}`, { method: "DELETE" });
    toast("Pengguna dihapus"); await load();
  });
});

form.addEventListener("submit", (e) => {
  e.preventDefault();
  guard(async () => {
    const body = {
      nama: form.nama.value.trim(), email: form.email.value.trim(),
      role: form.role.value, no_hp: form.no_hp.value.trim() || null,
    };
    if (form.password.value) body.password = form.password.value;
    await api(editId ? `/users/${editId}` : "/users", { method: editId ? "PUT" : "POST", body });
    $("#dlg").close(); toast("Pengguna disimpan"); await load();
  });
});

guard(load);
</script>
{% endblock %}
